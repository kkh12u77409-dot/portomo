<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مولد كلمات المرور — لوحة الأدوات</title>
  <meta name="description" content="توليد كلمات مرور قوية وآمنة مع مؤشر مستوى الأمان." />
  <script>!function(){try{var t=localStorage.getItem('toolbox_theme_v1');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}}();</script>
  <style>html{background-color:#f4f7fb}html[data-theme="dark"]{background-color:#0e1620}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container">
      <div class="header__inner">
        <a href="index.html" class="back-link">← الرئيسية</a>
        <h1 class="tool-page-title">🔐 مولد كلمات المرور</h1>
        <button id="themeToggle" class="btn btn--icon theme-toggle" type="button" aria-pressed="false" aria-label="تبديل الوضع الداكن">
          <span class="icon-sun" aria-hidden="true">☀️</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container tool-container">
      <div class="tool-card-solo" id="passgen-widget">

        <!-- عرض كلمة المرور -->
        <div class="passgen__display">
          <span class="passgen__output" id="pass-output" aria-label="كلمة المرور المولّدة" aria-live="polite">اضغط «توليد» للبدء</span>
          <div class="passgen__actions-inline">
            <button class="btn btn--icon btn--sm" type="button" id="pass-toggle-view" title="إظهار/إخفاء">👁</button>
            <button class="btn btn--icon btn--sm" type="button" id="pass-copy" title="نسخ">📋</button>
          </div>
        </div>

        <!-- مؤشر القوة -->
        <div class="strength-bar" aria-label="مؤشر قوة كلمة المرور">
          <div class="strength-bar__track">
            <div class="strength-bar__fill" id="strength-fill"></div>
          </div>
          <span class="strength-bar__label" id="strength-label">—</span>
        </div>

        <!-- الطول -->
        <div class="field">
          <div class="field__label-row">
            <label class="field__label" for="pass-length">الطول</label>
            <strong id="pass-length-val" class="field__label">16</strong>
          </div>
          <input type="range" id="pass-length" class="range-input"
            min="4" max="64" value="16" aria-label="طول كلمة المرور" />
        </div>

        <!-- الخيارات -->
        <div class="checkboxes" role="group" aria-label="خيارات كلمة المرور">
          <label class="checkbox-item">
            <input type="checkbox" id="opt-upper" checked />
            <span>أحرف كبيرة (A–Z)</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-lower" checked />
            <span>أحرف صغيرة (a–z)</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-nums" checked />
            <span>أرقام (0–9)</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-syms" checked />
            <span>رموز (!@#$…)</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="opt-ambiguous" />
            <span>استبعاد الأحرف المتشابهة (0 O l 1)</span>
          </label>
        </div>

        <!-- أزرار -->
        <div class="btn-row">
          <button class="btn btn--primary" type="button" id="pass-generate">🔐 توليد</button>
          <button class="btn btn--ghost btn--sm" type="button" id="pass-copy-2">📋 نسخ</button>
        </div>

        <p id="pass-status" class="status" hidden></p>
        <p id="pass-error"  class="field__error" role="alert" hidden></p>
      </div>
      <p class="tool-hint">💡 كلمات المرور تُولَّد محليًا ولا تُرسَل لأي خادم.</p>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><p class="footer__copy">© <span id="year"></span> لوحة الأدوات الشخصية</p></div></footer>
  <script src="script.js"></script>
</body>
</html>
