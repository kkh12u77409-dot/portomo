<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منسّق JSON — لوحة الأدوات</title>
  <meta name="description" content="تحقق من صحة JSON ثم نسّقه أو صغّره مباشرة داخل متصفحك." />
  <script>!function(){try{var t=localStorage.getItem('toolbox_theme_v1');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}}();</script>
  <style>html{background-color:#f4f7fb}html[data-theme="dark"]{background-color:#0e1620}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container"><div class="header__inner">
      <a href="index.html" class="back-link" aria-label="العودة للصفحة الرئيسية"><span aria-hidden="true">←</span> الرئيسية</a>
      <h1 class="tool-page-title">{ } منسّق JSON</h1>
      <button id="themeToggle" class="btn btn--icon theme-toggle" type="button" aria-pressed="false" aria-label="تبديل الوضع الداكن"><span class="icon-sun" aria-hidden="true">☀️</span><span class="icon-moon" aria-hidden="true">🌙</span></button>
    </div></div>
  </header>

  <main id="main" class="tool-page">
    <div class="container tool-container">
      <div class="tool-card-solo tool-card-solo--wide" id="json-widget">
        <div class="field">
          <label class="field__label" for="json-input">JSON المصدر</label>
          <textarea id="json-input" class="field__input field__input--area json-area" rows="10" spellcheck="false" dir="ltr" placeholder='{"name":"لوحة الأدوات","tools":13}' aria-describedby="json-hint"></textarea>
          <span id="json-hint" class="field__hint">الصق كائن JSON أو مصفوفة JSON صالحة.</span>
        </div>

        <div class="json-controls">
          <div class="field json-indent-field">
            <label class="field__label" for="json-indent">المسافة البادئة</label>
            <select id="json-indent" class="field__input" aria-label="المسافة البادئة">
              <option value="2">مسافتان</option>
              <option value="4">٤ مسافات</option>
              <option value="1">علامة تبويب</option>
            </select>
          </div>
          <div class="btn-row" role="group" aria-label="إجراءات JSON">
            <button class="btn btn--primary" type="button" id="json-format">✦ تنسيق والتحقق</button>
            <button class="btn" type="button" id="json-minify">↙ تصغير</button>
          </div>
        </div>

        <p id="json-error" class="field__error" role="alert" aria-live="assertive" hidden></p>

        <div class="field">
          <label class="field__label" for="json-output">النتيجة</label>
          <textarea id="json-output" class="field__input field__input--area json-area" rows="10" readonly dir="ltr" aria-label="ناتج JSON"></textarea>
        </div>

        <div class="btn-row">
          <button class="btn btn--ghost" type="button" id="json-copy">📋 نسخ النتيجة</button>
          <button class="btn btn--ghost" type="button" id="json-clear">🗑️ تفريغ</button>
          <p id="json-status" class="status" hidden></p>
        </div>
      </div>
      <p class="tool-hint">💡 لا يُرسل النص إلى أي خادم؛ تتم المعالجة داخل متصفحك.</p>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo"><div class="container"><p class="footer__copy">© <span id="year"></span> لوحة الأدوات الشخصية</p></div></footer>
  <script src="script.js"></script>
</body>
</html>
