<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>حاسب العمر — لوحة الأدوات</title>
  <meta name="description" content="احسب عمرك بالسنوات والأشهر والأيام واعرف متى عيد ميلادك القادم." />
  <script>!function(){try{var t=localStorage.getItem('toolbox_theme_v1');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}}();</script>
  <style>html{background-color:#f4f7fb}html[data-theme="dark"]{background-color:#0e1620}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container">
      <div class="header__inner">
        <a href="index.html" class="back-link">← الرئيسية</a>
        <h1 class="tool-page-title">🎂 حاسب العمر</h1>
        <button id="themeToggle" class="btn btn--icon theme-toggle" type="button" aria-pressed="false" aria-label="تبديل الوضع الداكن">
          <span class="icon-sun" aria-hidden="true">☀️</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container tool-container">
      <div class="tool-card-solo" id="age-widget">

        <div class="field">
          <label class="field__label" for="age-birthdate">تاريخ الميلاد</label>
          <input type="date" id="age-birthdate" class="field__input"
            aria-label="أدخل تاريخ ميلادك" />
        </div>

        <div class="field">
          <label class="field__label" for="age-refdate">احسب حتى تاريخ</label>
          <input type="date" id="age-refdate" class="field__input"
            aria-label="تاريخ المرجع (افتراضي: اليوم)" />
          <span class="field__hint">اتركه فارغًا لاستخدام تاريخ اليوم.</span>
        </div>

        <button class="btn btn--primary" type="button" id="age-calculate">🎂 احسب العمر</button>

        <!-- النتائج -->
        <div id="age-results" class="age-results" hidden aria-live="polite">
          <div class="stats-grid">
            <div class="stat">
              <div class="stat__label">السنوات</div>
              <div class="stat__value" id="age-years">—</div>
            </div>
            <div class="stat">
              <div class="stat__label">الأشهر</div>
              <div class="stat__value" id="age-months">—</div>
            </div>
            <div class="stat">
              <div class="stat__label">الأيام</div>
              <div class="stat__value" id="age-days">—</div>
            </div>
            <div class="stat">
              <div class="stat__label">إجمالي الأيام</div>
              <div class="stat__value" id="age-total-days">—</div>
            </div>
            <div class="stat">
              <div class="stat__label">إجمالي الأسابيع</div>
              <div class="stat__value" id="age-weeks">—</div>
            </div>
            <div class="stat">
              <div class="stat__label">إجمالي الساعات</div>
              <div class="stat__value" id="age-hours">—</div>
            </div>
          </div>
          <div class="age-birthday-info" id="age-birthday-info"></div>
        </div>

        <p id="age-error" class="field__error" role="alert" aria-live="assertive" hidden></p>
      </div>
      <p class="tool-hint">💡 كل النتائج تُحسَب بدقة مع مراعاة السنوات الكبيسة.</p>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><p class="footer__copy">© <span id="year"></span> لوحة الأدوات الشخصية</p></div></footer>
  <script src="script.js"></script>
</body>
</html>
