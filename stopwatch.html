<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ساعة إيقاف — لوحة الأدوات</title>
  <meta name="description" content="ساعة إيقاف دقيقة مع إمكانية حفظ أزمنة اللفات." />
  <script>!function(){try{var t=localStorage.getItem('toolbox_theme_v1');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}}();</script>
  <style>html{background-color:#f4f7fb}html[data-theme="dark"]{background-color:#0e1620}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container"><div class="header__inner">
      <a href="index.html" class="back-link" aria-label="العودة للصفحة الرئيسية"><span aria-hidden="true">←</span> الرئيسية</a>
      <h1 class="tool-page-title">⏱️ ساعة إيقاف</h1>
      <button id="themeToggle" class="btn btn--icon theme-toggle" type="button" aria-pressed="false" aria-label="تبديل الوضع الداكن"><span class="icon-sun" aria-hidden="true">☀️</span><span class="icon-moon" aria-hidden="true">🌙</span></button>
    </div></div>
  </header>

  <main id="main" class="tool-page">
    <div class="container tool-container">
      <div class="tool-card-solo" id="stopwatch-widget">
        <div class="stopwatch__screen" aria-live="polite" aria-label="الوقت المنقضي">
          <time id="stopwatch-display" class="stopwatch__time" datetime="PT0S">00:00:00.00</time>
        </div>

        <div class="stopwatch__actions" role="group" aria-label="التحكم بساعة الإيقاف">
          <button class="btn btn--primary" type="button" id="stopwatch-start">▶ تشغيل</button>
          <button class="btn" type="button" id="stopwatch-pause" disabled>⏸ إيقاف مؤقت</button>
          <button class="btn" type="button" id="stopwatch-lap" disabled>⚑ لفة</button>
          <button class="btn btn--ghost" type="button" id="stopwatch-reset" disabled>↺ إعادة</button>
        </div>

        <div class="laps" aria-label="أزمنة اللفات">
          <div class="laps__head"><span>اللفة</span><span>الإجمالي</span><span>زمن اللفة</span></div>
          <ol id="stopwatch-laps" class="laps__list"></ol>
          <p id="stopwatch-empty" class="laps__empty">سجّل لفة أثناء التشغيل لتظهر هنا.</p>
        </div>
      </div>
      <p class="tool-hint">💡 استخدم «لفة» لتسجيل زمن كل مرحلة من دون إيقاف الساعة.</p>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo"><div class="container"><p class="footer__copy">© <span id="year"></span> لوحة الأدوات الشخصية</p></div></footer>
  <script src="script.js"></script>
</body>
</html>
