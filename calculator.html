<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آلة حاسبة — لوحة الأدوات</title>
  <!-- تطبيق الثيم فورًا لمنع الوميض الأبيض عند التنقل -->
  <script>!function(){try{var t=localStorage.getItem('toolbox_theme_v1');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}}();</script>
  <style>html{background-color:#f4f7fb}html[data-theme="dark"]{background-color:#0e1620}</style>
  <meta name="description" content="آلة حاسبة بسيطة تدعم الأقواس والكسور والقوى — تعمل بدون إنترنت." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header" role="banner">
    <div class="container">
      <div class="header__inner">
        <a href="index.html" class="back-link" aria-label="العودة للصفحة الرئيسية">
          <span aria-hidden="true">←</span> الرئيسية
        </a>
        <h1 class="tool-page-title">🧮 آلة حاسبة</h1>
        <button id="themeToggle" class="btn btn--icon theme-toggle" type="button"
          aria-pressed="false" aria-label="تبديل الوضع الداكن">
          <span class="icon-sun" aria-hidden="true">☀️</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container tool-container">

      <div class="tool-card-solo" id="calc-widget" aria-label="آلة حاسبة">

        <!-- شاشة العرض -->
        <div class="calc__screen" id="calc-screen" tabindex="0"
          role="region" aria-label="شاشة الآلة الحاسبة" aria-live="polite">
          <div class="calc__expression" id="calc-expression" aria-label="التعبير الحالي">&nbsp;</div>
          <div class="calc__result" id="calc-result" aria-label="الناتج">0</div>
        </div>

        <!-- أزرار الحاسبة -->
        <div class="calc__keys" role="group" aria-label="أزرار الآلة الحاسبة">
          <button class="calc-key calc-key--fn" type="button" data-calc="clear" title="مسح الكل">C</button>
          <button class="calc-key calc-key--fn" type="button" data-calc="backspace" title="حذف">⌫</button>
          <button class="calc-key calc-key--op"  type="button" data-calc="(">(</button>
          <button class="calc-key calc-key--op"  type="button" data-calc=")">)</button>
          <button class="calc-key calc-key--equal" type="button" data-calc="=" aria-label="يساوي">=</button>

          <button class="calc-key" type="button" data-calc="7">7</button>
          <button class="calc-key" type="button" data-calc="8">8</button>
          <button class="calc-key" type="button" data-calc="9">9</button>
          <button class="calc-key calc-key--op" type="button" data-calc="/">÷</button>

          <button class="calc-key" type="button" data-calc="4">4</button>
          <button class="calc-key" type="button" data-calc="5">5</button>
          <button class="calc-key" type="button" data-calc="6">6</button>
          <button class="calc-key calc-key--op" type="button" data-calc="*">×</button>

          <button class="calc-key" type="button" data-calc="1">1</button>
          <button class="calc-key" type="button" data-calc="2">2</button>
          <button class="calc-key" type="button" data-calc="3">3</button>
          <button class="calc-key calc-key--op" type="button" data-calc="-">−</button>

          <button class="calc-key calc-key--wide" type="button" data-calc="0">0</button>
          <button class="calc-key" type="button" data-calc=".">.</button>
          <button class="calc-key calc-key--op" type="button" data-calc="+">+</button>

          <button class="calc-key calc-key--fn" type="button" data-calc="^" title="قوة">xʸ</button>
          <button class="calc-key calc-key--fn" type="button" data-calc="%">%</button>
          <button class="calc-key calc-key--fn calc-key--wide" type="button" data-calc="sqrt">√</button>
        </div>

        <p id="calc-error" class="field__error" role="alert" aria-live="assertive" hidden></p>
      </div>

      <p class="tool-hint">💡 يمكنك استخدام لوحة المفاتيح مباشرة عند تحديد الشاشة.</p>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p class="footer__copy">© <span id="year"></span> لوحة الأدوات الشخصية</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
