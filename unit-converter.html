<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>محول الوحدات — لوحة الأدوات</title>
  <meta name="description" content="تحويل الوحدات: طول، وزن، درجة حرارة، مساحة." />
  <script>!function(){try{var t=localStorage.getItem('toolbox_theme_v1');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')}catch(e){}}();</script>
  <style>html{background-color:#f4f7fb}html[data-theme="dark"]{background-color:#0e1620}</style>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header" role="banner">
    <div class="container">
      <div class="header__inner">
        <a href="index.html" class="back-link">← الرئيسية</a>
        <h1 class="tool-page-title">📐 محول الوحدات</h1>
        <button id="themeToggle" class="btn btn--icon theme-toggle" type="button" aria-pressed="false" aria-label="تبديل الوضع الداكن">
          <span class="icon-sun" aria-hidden="true">☀️</span>
          <span class="icon-moon" aria-hidden="true">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="tool-page">
    <div class="container tool-container">
      <div class="tool-card-solo" id="unit-widget">

        <!-- التصنيف -->
        <div class="field">
          <label class="field__label" for="unit-category">التصنيف</label>
          <div class="unit-category-tabs" role="group" aria-label="تصنيف الوحدات">
            <button class="tab-btn tab-btn--active" type="button" data-cat="length">📏 طول</button>
            <button class="tab-btn" type="button" data-cat="weight">⚖️ وزن</button>
            <button class="tab-btn" type="button" data-cat="temp">🌡️ حرارة</button>
            <button class="tab-btn" type="button" data-cat="area">🔲 مساحة</button>
          </div>
        </div>

        <!-- المدخلات -->
        <div class="unit-converter-grid">
          <div class="field">
            <label class="field__label" for="unit-from-val">القيمة</label>
            <input type="number" id="unit-from-val" class="field__input"
              placeholder="0" value="1" aria-label="القيمة المراد تحويلها" />
          </div>
          <div class="field">
            <label class="field__label" for="unit-from">من</label>
            <select id="unit-from" class="field__input" aria-label="الوحدة المصدر"></select>
          </div>
          <div class="unit-swap-col">
            <button class="btn btn--icon" type="button" id="unit-swap" title="تبديل">⇌</button>
          </div>
          <div class="field">
            <label class="field__label" for="unit-to">إلى</label>
            <select id="unit-to" class="field__input" aria-label="الوحدة الهدف"></select>
          </div>
        </div>

        <!-- النتيجة -->
        <div class="unit-result" id="unit-result" aria-live="polite" aria-label="نتيجة التحويل">
          <span class="unit-result__value" id="unit-result-val">—</span>
          <span class="unit-result__label" id="unit-result-label"></span>
        </div>

        <div class="btn-row">
          <button class="btn btn--ghost btn--sm" type="button" id="unit-copy">📋 نسخ النتيجة</button>
          <p id="unit-status" class="status" hidden></p>
        </div>

      </div>
      <p class="tool-hint">💡 التحويل يتم تلقائيًا فور تغيير أي قيمة.</p>
    </div>
  </main>

  <footer class="site-footer"><div class="container"><p class="footer__copy">© <span id="year"></span> لوحة الأدوات الشخصية</p></div></footer>
  <script src="script.js"></script>
</body>
</html>
